[package]
name = "photonic-matte"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
# ONNX Runtime — same version already pulled in transitively by `fastembed`, so
# no new native runtime binary is downloaded. `download-binaries` matches how
# fastembed provisions the ort shared library.
ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray"] }
ndarray = "0.16"
image = { workspace = true }
ureq = "2.12"
sha2 = "0.10"
anyhow = { workspace = true }
tracing = { workspace = true }
photonic-core = { path = "../photonic-core" }
